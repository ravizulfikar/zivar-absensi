<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cetak Kartu QR Absensi Siswa</title>
  <link rel="icon" type="image/png" href="/api/school/logo" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    .print-bar {
      background: linear-gradient(120deg, var(--brand-deep), var(--brand));
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 1120px;
      margin: 0 auto;
    }
    .qr-card {
      background: #fff;
      border: 1.5px solid #9ab4a7;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      break-inside: avoid;
    }
    .qr-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      border-bottom: 1.5px solid #d2e0d8;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .qr-card-head img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex: none;
    }
    .qr-card-head strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #143b32;
      line-height: 1.2;
    }
    .qr-card-head small {
      display: block;
      font-size: 9.5px;
      color: #526760;
      margin-top: 2px;
      line-height: 1.2;
    }
    .qr-card img.qr-code-img {
      width: 152px;
      height: 152px;
      display: block;
      margin: 0 auto 8px;
    }
    .qr-card-name {
      font-size: 14px;
      font-weight: 800;
      color: #162923;
    }
    .qr-card-meta {
      font-size: 12px;
      color: #526760;
      margin-top: 2px;
    }
    @media print {
      body { background: #fff; }
      .print-bar { display: none; }
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
        padding: 0;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="print-bar">
    <div><strong>Cetak Kartu QR Absensi Siswa</strong></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-white btn-sm" onclick="window.print()">Cetak / Simpan PDF</button>
      <a href="/admin" class="btn btn-ghost-light btn-sm">Kembali ke Admin</a>
    </div>
  </div>

  <div id="statusMsg" class="empty-state">Memuat kartu QR siswa...</div>
  <div id="cardsGrid" class="cards-grid hidden"></div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const kelas = params.get('kelas') || '';
      const idSiswa = params.get('id_siswa') || '';
      const statusMsg = document.getElementById('statusMsg');
      const grid = document.getElementById('cardsGrid');

      try {
        const setRes = await fetch('/api/admin/settings');
        if (setRes.status === 401) {
          statusMsg.textContent = 'Silakan login di Panel Admin terlebih dahulu untuk mencetak kartu QR.';
          return;
        }
        const setData = await setRes.json();
        const sCfg = setData.settings || {};
        const school = sCfg.nama_sekolah || 'SMK NEGERI 55 JAKARTA';
        const addr = sCfg.alamat_sekolah || 'Kartu Absensi Siswa';
        const logoUrl = sCfg.logo_url || '/api/school/logo';

        const q = new URLSearchParams({ filter: 'aktif' });
        if (kelas) q.set('kelas', kelas);
        const res = await fetch('/api/admin/students?' + q.toString());
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Gagal memuat siswa');

        let list = data.students || [];
        if (idSiswa) list = list.filter(s => String(s.id_siswa) === idSiswa);

        if (list.length === 0) {
          statusMsg.textContent = 'Tidak ada siswa aktif ditemukan untuk dicetak.';
          return;
        }

        statusMsg.classList.add('hidden');
        grid.classList.remove('hidden');

        list.forEach(s => {
          const div = document.createElement('div');
          div.className = 'qr-card';
          div.innerHTML = `
            <div class="qr-card-head">
              <img src="${escapeHtml(logoUrl)}" alt="" />
              <div>
                <strong>${escapeHtml(school)}</strong>
                <small>${escapeHtml(addr)}</small>
              </div>
            </div>
            <img class="qr-code-img" src="/api/admin/qr/${s.id_siswa}" alt="QR ${escapeHtml(s.nama)}" loading="lazy" />
            <div class="qr-card-name">${escapeHtml(s.nama)}</div>
            <div class="qr-card-meta tabular">NIS: ${escapeHtml(s.nis)} · ${escapeHtml(s.nama_kelas)}</div>
          `;
          grid.appendChild(div);
        });
      } catch (err) {
        statusMsg.textContent = 'Gagal memuat kartu QR: ' + err.message;
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
    })();
  </script>
</body>
</html>
